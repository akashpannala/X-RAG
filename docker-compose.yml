services:
  xrag:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SEED: ${SEED:-1}
    volumes:
      - ${XRAG_DATA_DIR:-xrag_data}:/app/data
      - ${XRAG_MODELS_DIR:-xrag_models}:/models
    ports:
      - "127.0.0.1:${XRAG_PORT:-8001}:8001"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - xrag
    restart: unless-stopped

volumes:
  xrag_data:
  xrag_models:
  caddy_data:
  caddy_config:
