<body class="bg-[#0e0e11] font-body-md text-body-md text-[#e2e8f0] min-h-screen flex flex-col justify-between selection:bg-[#1a6c81]/40 selection:text-[#a8c7fa] antialiased">
  <header class="h-14 bg-[#131314] border-b border-white/[0.06] sticky top-0 z-50 flex items-center justify-between px-5">
    <div class="flex items-center gap-2.5">
      <img alt="X-RAG" class="w-8 h-8 object-contain" src="assets/logo-short.png"/>
      <span class="text-base font-semibold tracking-tight text-[#e3e3e3]">X-RAG</span>
    </div>
    <a class="p-1.5 text-[#9aa0a6] hover:text-[#e3e3e3] hover:bg-[#282a2c] rounded-full transition-colors" href="https://github.com/akashpannala/X-RAG" target="_blank" rel="noreferrer" title="GitHub repository" aria-label="GitHub repository">
      <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-gutter py-space-xl bg-[#0e0e11]">
    <div class="flex flex-col w-full items-center justify-center relative overflow-hidden py-space-xl">
      <div class="absolute w-[580px] h-[580px] rounded-full bg-[#1a6c81]/15 blur-[140px] pointer-events-none -top-24 -left-20"></div>
      <div class="absolute w-[450px] h-[450px] rounded-full bg-[#004e5f]/15 blur-[120px] pointer-events-none -bottom-24 -right-12"></div>

      <div class="relative w-full max-w-[420px] px-gutter z-10">
        <div class="flex flex-col items-center text-center mb-space-lg">
          <img alt="X-RAG" class="w-14 h-14 object-contain mb-space-sm" src="assets/logo-short.png"/>
          <h1 class="font-headline-xl text-headline-xl text-[#f8fafc] tracking-tight mt-space-xs">Welcome back</h1>
          <p class="font-body-md text-body-md text-[#9aa0a6] mt-1 max-w-[320px]">
            Sign in with your workspace account to query indexed sources.
          </p>
        </div>

        <div class="bg-[#1b1c20] border border-white/[0.08] shadow-2xl rounded-2xl p-space-xl flex flex-col gap-space-lg">
          <div class="relative flex items-center justify-center">
            <div class="w-full h-px bg-white/[0.08]"></div>
            <span class="absolute bg-[#1b1c20] px-space-sm font-label-sm text-label-sm text-[#757b82] uppercase tracking-widest">email credentials</span>
          </div>

          <form class="flex flex-col gap-space-md" id="loginForm">
            <div id="loginError" class="hidden rounded-lg border border-[#ba1a1a]/40 bg-[#ba1a1a]/10 px-3 py-2 font-body-sm text-body-sm text-[#ffb4ab]"></div>

            <div class="flex flex-col gap-1.5">
              <label class="flex items-center justify-between font-label-md text-label-md text-[#cbd5e1]" for="username">
                <span>Username</span>
                <span class="font-label-sm text-label-sm text-[#757b82] font-normal">Internal directory</span>
              </label>
              <div class="relative flex items-center">
                <span class="material-symbols-outlined absolute left-3 text-[18px] text-[#64748b] pointer-events-none">person</span>
                <input class="w-full h-10 pl-9 pr-3 rounded-lg bg-[#141519] border border-white/[0.12] text-[#f8fafc] placeholder:text-[#64748b] font-body-md text-body-md focus:border-[#22d3ee] focus:ring-1 focus:ring-[#22d3ee]/50 focus:outline-none transition-all" id="username" name="username" placeholder="LUFFY" autocomplete="username" required="" type="text"/>
              </div>
            </div>

            <div class="flex flex-col gap-1.5">
              <div class="flex items-center justify-between font-label-md text-label-md">
                <label class="text-[#cbd5e1]" for="password">Password</label>
              </div>
              <div class="relative flex items-center">
                <span class="material-symbols-outlined absolute left-3 text-[18px] text-[#64748b] pointer-events-none">lock</span>
                <input class="w-full h-10 pl-9 pr-10 rounded-lg bg-[#141519] border border-white/[0.12] text-[#f8fafc] placeholder:text-[#64748b] font-body-md text-body-md focus:border-[#22d3ee] focus:ring-1 focus:ring-[#22d3ee]/50 focus:outline-none transition-all" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" required="" type="password"/>
                <button aria-label="Toggle password visibility" class="absolute right-2.5 p-1 rounded hover:bg-[#282a2c] text-[#9aa0a6] hover:text-[#f8fafc] transition-colors flex items-center justify-center" id="togglePasswordBtn" type="button">
                  <span class="material-symbols-outlined text-[18px]" id="passwordIcon">visibility_off</span>
                </button>
              </div>
            </div>

            <button class="w-full h-10 mt-1 rounded-lg bg-[#1a6c81] hover:bg-[#14596b] text-white font-headline-md text-headline-md tracking-wide flex items-center justify-center gap-space-xs transition-all active:scale-[0.99] shadow-lg shadow-[#1a6c81]/25 hover:shadow-[#1a6c81]/40 border border-[#8ad1e8]/20 disabled:opacity-60 disabled:cursor-not-allowed" id="submitBtn" type="submit">
              <span class="material-symbols-outlined text-[18px]" id="submitIcon">vpn_key</span>
              <span id="submitLabel">Sign In to Workspace</span>
            </button>
          </form>

          <div class="bg-[#15161a] border border-white/[0.06] rounded-xl p-space-sm flex flex-col gap-space-xs">
            <div class="flex items-center justify-between">
              <span class="font-label-sm text-label-sm text-[#9aa0a6] uppercase tracking-wider flex items-center gap-1 font-semibold">
                <span class="material-symbols-outlined text-[14px] text-[#38bdf8]">science</span>
                Demo Presets
              </span>
              <span class="font-label-sm text-label-sm text-[#64748b]">Click to populate</span>
            </div>
            <div class="grid grid-cols-2 gap-space-xs">
              <button class="text-left px-2 py-1.5 rounded-lg bg-[#1e2025] hover:bg-[#282a2f] border border-white/[0.04] transition-colors flex flex-col" data-demo-user="LUFFY" type="button">
                <span class="font-label-md text-label-md text-[#e2e8f0]">LUFFY@corp</span>
                <span class="font-label-sm text-label-sm text-[#94a3b8]">HR + public · quick mode</span>
              </button>
              <button class="text-left px-2 py-1.5 rounded-lg bg-[#1e2025] hover:bg-[#282a2f] border border-white/[0.04] transition-colors flex flex-col" data-demo-user="ZORO" type="button">
                <span class="font-label-md text-label-md text-[#e2e8f0]">ZORO@corp</span>
                <span class="font-label-sm text-label-sm text-[#94a3b8]">Eng + public · deep mode</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
