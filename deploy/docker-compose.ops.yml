# Phase 4 ops stack (PRD L22). Start: docker compose -f deploy/docker-compose.ops.yml up -d
# Backend/worker run on the HOST (not here) and reach redis on localhost:6379,
# qdrant on localhost:6333, Langfuse web on localhost:8080.
# Portainer on :8000 is unaffected.
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse-keeper:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    command: ["clickhouse", "keeper", "--config-file=/etc/clickhouse-keeper/keeper_config.xml"]
    volumes:
      - ./clickhouse/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper_data:/var/lib/clickhouse-keeper
    healthcheck:
      test: ["CMD-SHELL", "clickhouse keeper-client --host 127.0.0.1 get / >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
      - ./clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8080:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123/langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:clickhouse@clickhouse:9000/langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_CONNECTION_STRING: redis://redis:6379
      NEXTAUTH_URL: http://localhost:8080
      NEXTAUTH_SECRET: b8c7e5224a1cf7feb801bccfc58baf8135fd8d9acfc45ad3
      SALT: 7516c4257eeb36476880064053ce43d8
      ENCRYPTION_KEY: 7f53c84f27edc6c3383161a8514af89cc231052a4c96c48690181ea9178e8362
      LANGFUSE_INIT_USER_EMAIL: admin@offline-rag.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin12345
      LANGFUSE_INIT_PROJECT_ID: 312d54c8-676f-40c1-9c58-749a4ecbd1b6
      LANGFUSE_INIT_PROJECT_NAME: RAG
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-24067efb99fb4b35a3529e5148098459
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-fb4fec96269547908de4401e4603fae6
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123/langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:clickhouse@clickhouse:9000/langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_CONNECTION_STRING: redis://redis:6379
      SALT: 7516c4257eeb36476880064053ce43d8
      ENCRYPTION_KEY: 7f53c84f27edc6c3383161a8514af89cc231052a4c96c48690181ea9178e8362
      LANGFUSE_INIT_USER_EMAIL: admin@offline-rag.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin12345
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events

volumes:
  qdrant_data:
  redis_data:
  langfuse_db:
  clickhouse_data:
  keeper_data: