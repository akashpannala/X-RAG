services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["../data/qdrant_storage:/qdrant/storage"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
  api:
    build: ..
    command: python -m backend.run 8000
    ports: ["8000:8000"]
    env_file: ../.env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes: ["../data:/app/data"]
    depends_on: [qdrant]
volumes:
  ollama_models:
